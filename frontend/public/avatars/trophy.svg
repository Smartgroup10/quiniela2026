<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Trofeo con gafas de sol -->
  <!-- Left handle -->
  <path d="M14 16 Q6 16 6 26 Q6 34 14 34" stroke="#DAA520" stroke-width="3" fill="none"/>
  <!-- Right handle -->
  <path d="M50 16 Q58 16 58 26 Q58 34 50 34" stroke="#DAA520" stroke-width="3" fill="none"/>
  <!-- Cup body -->
  <path d="M14 10 L14 30 Q14 42 32 44 Q50 42 50 30 L50 10 Z" fill="#FFD700" stroke="#1a1a2e" stroke-width="2"/>
  <!-- Cup shine -->
  <path d="M18 12 L18 28 Q18 36 28 40" stroke="#FFF8DC" stroke-width="2" fill="none" opacity="0.6"/>
  <!-- Cup rim -->
  <rect x="12" y="8" width="40" height="4" rx="2" fill="#DAA520" stroke="#1a1a2e" stroke-width="2"/>
  <!-- Sunglasses -->
  <rect x="18" y="20" width="10" height="7" rx="2" fill="#1a1a2e" stroke="#333" stroke-width="1.5"/>
  <rect x="36" y="20" width="10" height="7" rx="2" fill="#1a1a2e" stroke="#333" stroke-width="1.5"/>
  <!-- Sunglasses bridge -->
  <line x1="28" y1="23" x2="36" y2="23" stroke="#333" stroke-width="2"/>
  <!-- Sunglasses temples -->
  <line x1="18" y1="23" x2="14" y2="21" stroke="#333" stroke-width="2"/>
  <line x1="46" y1="23" x2="50" y2="21" stroke="#333" stroke-width="2"/>
  <!-- Lens shine -->
  <rect x="20" y="22" width="3" height="2" rx="0.5" fill="#555" opacity="0.5"/>
  <rect x="38" y="22" width="3" height="2" rx="0.5" fill="#555" opacity="0.5"/>
  <!-- Cool smirk -->
  <path d="M26 32 Q32 36 38 32" stroke="#1a1a2e" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Stem -->
  <rect x="28" y="44" width="8" height="6" rx="1" fill="#DAA520" stroke="#1a1a2e" stroke-width="1.5"/>
  <!-- Base -->
  <rect x="20" y="50" width="24" height="4" rx="2" fill="#DAA520" stroke="#1a1a2e" stroke-width="2"/>
  <rect x="16" y="54" width="32" height="5" rx="2" fill="#8B6914" stroke="#1a1a2e" stroke-width="2"/>
  <!-- Base plate text -->
  <text x="32" y="58" text-anchor="middle" font-family="monospace" font-size="4" font-weight="bold" fill="#FFD700">MVP</text>
  <!-- Sparkles -->
  <polygon points="8,8 10,4 12,8 10,12" fill="#FFD700" opacity="0.8"/>
  <polygon points="52,4 54,0 56,4 54,8" fill="#FFD700" opacity="0.8"/>
  <polygon points="4,30 6,26 8,30 6,34" fill="#FFD700" opacity="0.6"/>
</svg>