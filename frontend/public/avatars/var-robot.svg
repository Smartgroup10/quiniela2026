<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- VAR Robot -->
  <!-- Antenna -->
  <line x1="32" y1="2" x2="32" y2="8" stroke="#C0C0C0" stroke-width="2"/>
  <circle cx="32" cy="2" r="2" fill="#E74C3C"/>
  <!-- Antenna signal waves -->
  <path d="M26 4 Q28 0 30 4" stroke="#E74C3C" stroke-width="1" fill="none" opacity="0.6"/>
  <path d="M34 4 Q36 0 38 4" stroke="#E74C3C" stroke-width="1" fill="none" opacity="0.6"/>
  <!-- Robot head -->
  <rect x="14" y="8" width="36" height="28" rx="4" fill="#607D8B" stroke="#1a1a2e" stroke-width="2"/>
  <!-- Screen face -->
  <rect x="18" y="12" width="28" height="20" rx="2" fill="#0a0a1a" stroke="#00E5FF" stroke-width="1.5"/>
  <!-- Screen content: replay lines -->
  <rect x="20" y="14" width="24" height="1" fill="#00E5FF" opacity="0.3"/>
  <rect x="20" y="30" width="24" height="1" fill="#00E5FF" opacity="0.3"/>
  <!-- VAR text on screen -->
  <text x="32" y="21" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#00E5FF">VAR</text>
  <!-- Replay icon on screen -->
  <path d="M26 26 L30 24 L30 28 Z" fill="#00E5FF"/>
  <rect x="31" y="24" width="2" height="4" fill="#00E5FF" opacity="0.6"/>
  <rect x="34" y="24" width="2" height="4" fill="#00E5FF" opacity="0.6"/>
  <!-- Screen scanline effect -->
  <rect x="18" y="18" width="28" height="1" fill="white" opacity="0.08"/>
  <rect x="18" y="24" width="28" height="1" fill="white" opacity="0.08"/>
  <!-- Robot eyes (on top of screen) -->
  <circle cx="26" cy="16" r="2" fill="#FF0" stroke="#1a1a2e" stroke-width="1"/>
  <circle cx="38" cy="16" r="2" fill="#FF0" stroke="#1a1a2e" stroke-width="1"/>
  <circle cx="26" cy="16" r="0.8" fill="#1a1a2e"/>
  <circle cx="38" cy="16" r="0.8" fill="#1a1a2e"/>
  <!-- Side bolts -->
  <circle cx="12" cy="22" r="3" fill="#C0C0C0" stroke="#1a1a2e" stroke-width="1.5"/>
  <circle cx="52" cy="22" r="3" fill="#C0C0C0" stroke="#1a1a2e" stroke-width="1.5"/>
  <circle cx="12" cy="22" r="1" fill="#888"/>
  <circle cx="52" cy="22" r="1" fill="#888"/>
  <!-- Neck -->
  <rect x="28" y="36" width="8" height="4" fill="#78909C" stroke="#1a1a2e" stroke-width="1"/>
  <!-- Body -->
  <rect x="18" y="40" width="28" height="16" rx="3" fill="#78909C" stroke="#1a1a2e" stroke-width="2"/>
  <!-- Body panel -->
  <rect x="22" y="43" width="20" height="10" rx="1" fill="#607D8B"/>
  <!-- Body buttons -->
  <circle cx="27" cy="48" r="2" fill="#2ECC40"/>
  <circle cx="33" cy="48" r="2" fill="#FFD700"/>
  <circle cx="39" cy="48" r="2" fill="#E74C3C"/>
  <!-- Arms -->
  <rect x="8" y="42" width="10" height="4" rx="2" fill="#90A4AE" stroke="#1a1a2e" stroke-width="1.5"/>
  <rect x="46" y="42" width="10" height="4" rx="2" fill="#90A4AE" stroke="#1a1a2e" stroke-width="1.5"/>
  <!-- Feet -->
  <rect x="20" y="56" width="10" height="5" rx="2" fill="#546E7A" stroke="#1a1a2e" stroke-width="1.5"/>
  <rect x="34" y="56" width="10" height="5" rx="2" fill="#546E7A" stroke="#1a1a2e" stroke-width="1.5"/>
</svg>