<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- GOAT - cabra con balon, wearing #10 -->
  <!-- Horns -->
  <path d="M20 14 Q14 4 10 8" stroke="#8D6E63" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M44 14 Q50 4 54 8" stroke="#8D6E63" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Head -->
  <ellipse cx="32" cy="18" rx="14" ry="12" fill="white" stroke="#1a1a2e" stroke-width="2"/>
  <!-- Ears -->
  <ellipse cx="16" cy="16" rx="5" ry="3" fill="#FFDAB9" stroke="#1a1a2e" stroke-width="1.5" transform="rotate(-20 16 16)"/>
  <ellipse cx="48" cy="16" rx="5" ry="3" fill="#FFDAB9" stroke="#1a1a2e" stroke-width="1.5" transform="rotate(20 48 16)"/>
  <!-- Eyes (cool/confident) -->
  <circle cx="26" cy="16" r="3" fill="white" stroke="#1a1a2e" stroke-width="1.5"/>
  <circle cx="38" cy="16" r="3" fill="white" stroke="#1a1a2e" stroke-width="1.5"/>
  <circle cx="27" cy="15.5" r="2" fill="#1a1a2e"/>
  <circle cx="39" cy="15.5" r="2" fill="#1a1a2e"/>
  <circle cx="27.5" cy="15" r="0.7" fill="white"/>
  <circle cx="39.5" cy="15" r="0.7" fill="white"/>
  <!-- Smug eyebrows -->
  <line x1="23" y1="11" x2="28" y2="12" stroke="#1a1a2e" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="36" y1="12" x2="41" y2="11" stroke="#1a1a2e" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Snout -->
  <ellipse cx="32" cy="23" rx="6" ry="4" fill="#FFDAB9" stroke="#1a1a2e" stroke-width="1.5"/>
  <!-- Nostrils -->
  <circle cx="30" cy="22" r="1" fill="#1a1a2e"/>
  <circle cx="34" cy="22" r="1" fill="#1a1a2e"/>
  <!-- Confident smile -->
  <path d="M28 25 Q32 28 36 25" stroke="#1a1a2e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Goatee beard -->
  <path d="M29 28 Q32 34 35 28" fill="#DDD" stroke="#ccc" stroke-width="1"/>
  <!-- Jersey -->
  <rect x="22" y="30" width="20" height="16" rx="3" fill="#3498DB" stroke="#1a1a2e" stroke-width="2"/>
  <!-- Collar -->
  <path d="M26 30 Q32 34 38 30" stroke="white" stroke-width="1.5" fill="none"/>
  <!-- Number 10 -->
  <text x="32" y="42" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="white">10</text>
  <!-- Arms/legs (hooves) -->
  <rect x="12" y="34" width="10" height="4" rx="2" fill="#3498DB" stroke="#1a1a2e" stroke-width="1"/>
  <rect x="42" y="34" width="10" height="4" rx="2" fill="#3498DB" stroke="#1a1a2e" stroke-width="1"/>
  <!-- Hooves on hands -->
  <rect x="10" y="34" width="4" height="4" rx="1" fill="#555" stroke="#1a1a2e" stroke-width="1"/>
  <rect x="50" y="34" width="4" height="4" rx="1" fill="#555" stroke="#1a1a2e" stroke-width="1"/>
  <!-- Legs -->
  <rect x="24" y="46" width="5" height="8" rx="1" fill="white" stroke="#1a1a2e" stroke-width="1"/>
  <rect x="35" y="46" width="5" height="8" rx="1" fill="white" stroke="#1a1a2e" stroke-width="1"/>
  <!-- Hooves on feet -->
  <rect x="23" y="54" width="7" height="4" rx="1" fill="#555" stroke="#1a1a2e" stroke-width="1.5"/>
  <rect x="34" y="54" width="7" height="4" rx="1" fill="#555" stroke="#1a1a2e" stroke-width="1.5"/>
  <!-- Ball at feet -->
  <circle cx="48" cy="56" r="5" fill="white" stroke="#1a1a2e" stroke-width="1.5"/>
  <polygon points="48,52 50,54 49,56 47,56 46,54" fill="#1a1a2e" transform="scale(0.8) translate(10 11)"/>
  <!-- Crown/halo (GOAT status) -->
  <polygon points="25,4 28,0 32,3 36,0 39,4 37,5 32,2 27,5" fill="#FFD700" stroke="#DAA520" stroke-width="1"/>
  <circle cx="28" cy="1" r="1" fill="#E74C3C"/>
  <circle cx="32" cy="3" r="1" fill="#3498DB"/>
  <circle cx="36" cy="1" r="1" fill="#2ECC40"/>
</svg>