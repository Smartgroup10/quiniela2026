<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Portero con guantes gigantes - diving pose -->
  <!-- Body diving to the right -->
  <rect x="18" y="28" width="20" height="16" rx="3" fill="#2ECC40" stroke="#1a1a2e" stroke-width="2"/>
  <!-- Head -->
  <circle cx="28" cy="20" r="10" fill="#FFDAB9" stroke="#1a1a2e" stroke-width="2"/>
  <!-- Cap -->
  <rect x="18" y="12" width="20" height="6" rx="2" fill="#2ECC40" stroke="#1a1a2e" stroke-width="1.5"/>
  <rect x="16" y="16" width="24" height="3" rx="1" fill="#27AE60"/>
  <!-- Eyes -->
  <circle cx="24" cy="20" r="2" fill="#1a1a2e"/>
  <circle cx="33" cy="20" r="2" fill="#1a1a2e"/>
  <!-- Determined mouth -->
  <rect x="26" y="25" width="5" height="2" rx="1" fill="#1a1a2e"/>
  <!-- Left giant glove -->
  <rect x="4" y="22" width="14" height="12" rx="4" fill="#FFD700" stroke="#1a1a2e" stroke-width="2"/>
  <rect x="2" y="26" width="5" height="4" rx="2" fill="#FFD700" stroke="#1a1a2e" stroke-width="1.5"/>
  <!-- Right giant glove (reaching up) -->
  <rect x="38" y="14" width="14" height="12" rx="4" fill="#FFD700" stroke="#1a1a2e" stroke-width="2"/>
  <rect x="52" y="18" width="5" height="4" rx="2" fill="#FFD700" stroke="#1a1a2e" stroke-width="1.5"/>
  <!-- Arms -->
  <rect x="14" y="28" width="6" height="3" rx="1" fill="#2ECC40" stroke="#1a1a2e" stroke-width="1"/>
  <rect x="36" y="24" width="6" height="3" rx="1" fill="#2ECC40" stroke="#1a1a2e" stroke-width="1"/>
  <!-- Shorts -->
  <rect x="20" y="44" width="8" height="6" rx="1" fill="#1a1a2e" stroke="#1a1a2e" stroke-width="1"/>
  <rect x="28" y="44" width="8" height="6" rx="1" fill="#1a1a2e" stroke="#1a1a2e" stroke-width="1"/>
  <!-- Legs -->
  <rect x="21" y="50" width="6" height="6" rx="1" fill="#FFDAB9" stroke="#1a1a2e" stroke-width="1"/>
  <rect x="30" y="50" width="6" height="6" rx="1" fill="#FFDAB9" stroke="#1a1a2e" stroke-width="1"/>
  <!-- Boots -->
  <rect x="19" y="56" width="10" height="4" rx="2" fill="#2ECC40" stroke="#1a1a2e" stroke-width="1.5"/>
  <rect x="28" y="56" width="10" height="4" rx="2" fill="#2ECC40" stroke="#1a1a2e" stroke-width="1.5"/>
  <!-- Number 1 on jersey -->
  <text x="28" y="40" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="white">1</text>
</svg>