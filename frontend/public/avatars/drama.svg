<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Jugador simulando falta (flopping/diving) -->
  <!-- Ground -->
  <rect x="0" y="52" width="64" height="12" rx="2" fill="#27AE60" opacity="0.3"/>
  <!-- Body lying on ground -->
  <rect x="8" y="38" width="22" height="14" rx="3" fill="#9B59B6" stroke="#1a1a2e" stroke-width="2"/>
  <!-- Jersey number -->
  <text x="19" y="48" text-anchor="middle" font-family="monospace" font-size="7" font-weight="bold" fill="white">7</text>
  <!-- Head (on ground, dramatic) -->
  <circle cx="40" cy="42" r="9" fill="#FFDAB9" stroke="#1a1a2e" stroke-width="2"/>
  <!-- Dramatic hair -->
  <path d="M34 36 Q36 30 42 32 Q48 30 50 36" fill="#1a1a2e"/>
  <!-- Crying/dramatic eyes -->
  <path d="M36 40 L38 38" stroke="#1a1a2e" stroke-width="2" stroke-linecap="round"/>
  <path d="M38 40 L36 38" stroke="#1a1a2e" stroke-width="2" stroke-linecap="round"/>
  <path d="M42 40 L44 38" stroke="#1a1a2e" stroke-width="2" stroke-linecap="round"/>
  <path d="M44 40 L42 38" stroke="#1a1a2e" stroke-width="2" stroke-linecap="round"/>
  <!-- Wide open dramatic mouth -->
  <ellipse cx="40" cy="46" rx="4" ry="3" fill="#1a1a2e"/>
  <path d="M37 45 Q40 44 43 45" fill="white"/>
  <!-- Tears -->
  <path d="M35 42 Q34 46 33 44" fill="#3498DB" stroke="#3498DB" stroke-width="0.8"/>
  <path d="M46 42 Q47 46 48 44" fill="#3498DB" stroke="#3498DB" stroke-width="0.8"/>
  <circle cx="33" cy="48" r="1.5" fill="#3498DB" opacity="0.6"/>
  <circle cx="48" cy="48" r="1.5" fill="#3498DB" opacity="0.6"/>
  <!-- Leg up dramatically -->
  <rect x="4" y="44" width="5" height="14" rx="2" fill="white" stroke="#1a1a2e" stroke-width="1.5" transform="rotate(30 6 51)"/>
  <!-- Other leg -->
  <rect x="14" y="50" width="5" height="10" rx="2" fill="white" stroke="#1a1a2e" stroke-width="1.5" transform="rotate(-15 16 55)"/>
  <!-- Boot up in air -->
  <rect x="0" y="38" width="8" height="4" rx="2" fill="#E74C3C" stroke="#1a1a2e" stroke-width="1" transform="rotate(30 4 40)"/>
  <!-- Arms grabbing shin dramatically -->
  <rect x="6" y="48" width="10" height="4" rx="2" fill="#FFDAB9" stroke="#1a1a2e" stroke-width="1"/>
  <!-- Pain stars -->
  <polygon points="52,16 54,22 60,22 55,26 57,32 52,28 47,32 49,26 44,22 50,22" fill="#FFD700" stroke="#1a1a2e" stroke-width="1"/>
  <polygon points="10,14 11,17 14,17 12,19 13,22 10,20 7,22 8,19 6,17 9,17" fill="#FFD700" stroke="#1a1a2e" stroke-width="0.8"/>
  <!-- Exclamation marks -->
  <text x="56" y="12" font-family="monospace" font-size="10" font-weight="bold" fill="#E74C3C">!</text>
  <text x="48" y="10" font-family="monospace" font-size="8" font-weight="bold" fill="#E74C3C">!</text>
  <!-- Sweat drops -->
  <circle cx="36" cy="34" r="1" fill="#3498DB"/>
  <circle cx="44" cy="32" r="1" fill="#3498DB"/>
</svg>