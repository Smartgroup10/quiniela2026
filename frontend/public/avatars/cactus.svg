<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Cactus portero - Mexico 2026 theme -->
  <!-- Main cactus body -->
  <rect x="24" y="12" width="16" height="36" rx="8" fill="#2ECC40" stroke="#1a1a2e" stroke-width="2"/>
  <!-- Cactus texture lines -->
  <line x1="28" y1="14" x2="28" y2="46" stroke="#27AE60" stroke-width="1" opacity="0.5"/>
  <line x1="32" y1="14" x2="32" y2="46" stroke="#27AE60" stroke-width="1" opacity="0.5"/>
  <line x1="36" y1="14" x2="36" y2="46" stroke="#27AE60" stroke-width="1" opacity="0.5"/>
  <!-- Left arm (reaching out like goalkeeper) -->
  <rect x="10" y="20" width="14" height="8" rx="4" fill="#2ECC40" stroke="#1a1a2e" stroke-width="2"/>
  <rect x="6" y="12" width="8" height="14" rx="4" fill="#2ECC40" stroke="#1a1a2e" stroke-width="2"/>
  <!-- Left arm texture -->
  <line x1="10" y1="14" x2="10" y2="24" stroke="#27AE60" stroke-width="1" opacity="0.5"/>
  <!-- Right arm (reaching up) -->
  <rect x="40" y="18" width="14" height="8" rx="4" fill="#2ECC40" stroke="#1a1a2e" stroke-width="2"/>
  <rect x="50" y="8" width="8" height="16" rx="4" fill="#2ECC40" stroke="#1a1a2e" stroke-width="2"/>
  <!-- Right arm texture -->
  <line x1="54" y1="10" x2="54" y2="22" stroke="#27AE60" stroke-width="1" opacity="0.5"/>
  <!-- Goalkeeper gloves -->
  <rect x="2" y="8" width="10" height="8" rx="3" fill="#FFD700" stroke="#1a1a2e" stroke-width="2"/>
  <rect x="0" y="12" width="4" height="4" rx="2" fill="#FFD700" stroke="#1a1a2e" stroke-width="1"/>
  <rect x="50" y="4" width="10" height="8" rx="3" fill="#FFD700" stroke="#1a1a2e" stroke-width="2"/>
  <rect x="60" y="6" width="4" height="4" rx="2" fill="#FFD700" stroke="#1a1a2e" stroke-width="1"/>
  <!-- Face -->
  <!-- Eyes -->
  <circle cx="28" cy="22" r="2.5" fill="white" stroke="#1a1a2e" stroke-width="1.5"/>
  <circle cx="36" cy="22" r="2.5" fill="white" stroke="#1a1a2e" stroke-width="1.5"/>
  <circle cx="28.5" cy="21.5" r="1.5" fill="#1a1a2e"/>
  <circle cx="36.5" cy="21.5" r="1.5" fill="#1a1a2e"/>
  <circle cx="29" cy="21" r="0.5" fill="white"/>
  <circle cx="37" cy="21" r="0.5" fill="white"/>
  <!-- Happy determined smile -->
  <path d="M28 28 Q32 32 36 28" stroke="#1a1a2e" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Blush -->
  <circle cx="25" cy="27" r="2" fill="#FF6B6B" opacity="0.4"/>
  <circle cx="39" cy="27" r="2" fill="#FF6B6B" opacity="0.4"/>
  <!-- Small sombrero on top -->
  <ellipse cx="32" cy="12" rx="14" ry="3" fill="#8B4513" stroke="#1a1a2e" stroke-width="1.5"/>
  <rect x="26" y="4" width="12" height="8" rx="2" fill="#A0522D" stroke="#1a1a2e" stroke-width="1.5"/>
  <rect x="24" y="10" width="16" height="3" rx="1" fill="#8B4513"/>
  <!-- Sombrero band -->
  <rect x="26" y="8" width="12" height="2" fill="#E74C3C"/>
  <rect x="28" y="8" width="2" height="2" fill="#2ECC40"/>
  <rect x="34" y="8" width="2" height="2" fill="#2ECC40"/>
  <!-- Cactus spines -->
  <line x1="24" y1="18" x2="21" y2="16" stroke="#27AE60" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24" y1="30" x2="21" y2="28" stroke="#27AE60" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="40" y1="24" x2="43" y2="22" stroke="#27AE60" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="40" y1="34" x2="43" y2="32" stroke="#27AE60" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Pot/base -->
  <rect x="22" y="48" width="20" height="10" rx="3" fill="#D35400" stroke="#1a1a2e" stroke-width="2"/>
  <!-- Pot decoration (Mexican pattern) -->
  <rect x="24" y="50" width="16" height="2" fill="#E74C3C"/>
  <rect x="24" y="54" width="16" height="2" fill="#2ECC40"/>
  <!-- Mexico 2026 text -->
  <text x="32" y="62" text-anchor="middle" font-family="monospace" font-size="4" font-weight="bold" fill="#FFD700">2026</text>
</svg>