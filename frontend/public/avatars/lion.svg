<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Mascota leon con camiseta -->
  <!-- Mane -->
  <circle cx="32" cy="20" r="18" fill="#E67E22"/>
  <circle cx="18" cy="14" r="6" fill="#D35400"/>
  <circle cx="46" cy="14" r="6" fill="#D35400"/>
  <circle cx="14" cy="22" r="6" fill="#D35400"/>
  <circle cx="50" cy="22" r="6" fill="#D35400"/>
  <circle cx="18" cy="30" r="5" fill="#D35400"/>
  <circle cx="46" cy="30" r="5" fill="#D35400"/>
  <circle cx="24" cy="8" r="5" fill="#D35400"/>
  <circle cx="40" cy="8" r="5" fill="#D35400"/>
  <circle cx="32" cy="6" r="5" fill="#D35400"/>
  <!-- Face -->
  <circle cx="32" cy="22" r="13" fill="#F5CBA7" stroke="#1a1a2e" stroke-width="2"/>
  <!-- Inner ears -->
  <ellipse cx="20" cy="12" rx="3" ry="4" fill="#F5CBA7"/>
  <ellipse cx="44" cy="12" rx="3" ry="4" fill="#F5CBA7"/>
  <!-- Eyes -->
  <circle cx="27" cy="20" r="3" fill="white" stroke="#1a1a2e" stroke-width="1.5"/>
  <circle cx="37" cy="20" r="3" fill="white" stroke="#1a1a2e" stroke-width="1.5"/>
  <circle cx="28" cy="19" r="1.8" fill="#1a1a2e"/>
  <circle cx="38" cy="19" r="1.8" fill="#1a1a2e"/>
  <circle cx="28.5" cy="18.5" r="0.6" fill="white"/>
  <circle cx="38.5" cy="18.5" r="0.6" fill="white"/>
  <!-- Nose -->
  <ellipse cx="32" cy="25" rx="3" ry="2" fill="#1a1a2e"/>
  <!-- Mouth -->
  <path d="M29 27 Q32 31 35 27" stroke="#1a1a2e" stroke-width="1.5" fill="none"/>
  <line x1="32" y1="27" x2="32" y2="29" stroke="#1a1a2e" stroke-width="1.5"/>
  <!-- Whiskers -->
  <line x1="18" y1="24" x2="24" y2="25" stroke="#1a1a2e" stroke-width="1" opacity="0.6"/>
  <line x1="18" y1="27" x2="24" y2="27" stroke="#1a1a2e" stroke-width="1" opacity="0.6"/>
  <line x1="40" y1="25" x2="46" y2="24" stroke="#1a1a2e" stroke-width="1" opacity="0.6"/>
  <line x1="40" y1="27" x2="46" y2="27" stroke="#1a1a2e" stroke-width="1" opacity="0.6"/>
  <!-- Jersey body -->
  <rect x="22" y="34" width="20" height="18" rx="3" fill="#E74C3C" stroke="#1a1a2e" stroke-width="2"/>
  <!-- Jersey collar -->
  <path d="M26 34 Q32 38 38 34" stroke="white" stroke-width="2" fill="none"/>
  <!-- Jersey number -->
  <text x="32" y="48" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="white">1</text>
  <!-- Arms (paws) -->
  <rect x="10" y="36" width="12" height="5" rx="2" fill="#F5CBA7" stroke="#1a1a2e" stroke-width="1.5"/>
  <rect x="42" y="36" width="12" height="5" rx="2" fill="#F5CBA7" stroke="#1a1a2e" stroke-width="1.5"/>
  <!-- Paw pads -->
  <circle cx="11" cy="38" r="1" fill="#D35400"/>
  <circle cx="14" cy="38" r="1" fill="#D35400"/>
  <circle cx="52" cy="38" r="1" fill="#D35400"/>
  <circle cx="49" cy="38" r="1" fill="#D35400"/>
  <!-- Feet -->
  <rect x="22" y="52" width="8" height="6" rx="3" fill="#F5CBA7" stroke="#1a1a2e" stroke-width="1.5"/>
  <rect x="34" y="52" width="8" height="6" rx="3" fill="#F5CBA7" stroke="#1a1a2e" stroke-width="1.5"/>
  <!-- Tail -->
  <path d="M42 46 Q52 44 54 52 Q56 56 52 54" stroke="#E67E22" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="52" cy="54" r="3" fill="#D35400"/>
</svg>