<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Hincha con peluca loca -->
  <!-- Rainbow wig -->
  <ellipse cx="32" cy="12" rx="18" ry="12" fill="#E74C3C"/>
  <ellipse cx="22" cy="10" rx="8" ry="9" fill="#FF6B35"/>
  <ellipse cx="42" cy="10" rx="8" ry="9" fill="#9B59B6"/>
  <ellipse cx="32" cy="6" rx="10" ry="7" fill="#FFD700"/>
  <ellipse cx="26" cy="5" rx="6" ry="5" fill="#2ECC40"/>
  <ellipse cx="38" cy="5" rx="6" ry="5" fill="#3498DB"/>
  <ellipse cx="16" cy="14" rx="5" ry="6" fill="#E91E63"/>
  <ellipse cx="48" cy="14" rx="5" ry="6" fill="#00BCD4"/>
  <!-- Face -->
  <circle cx="32" cy="24" r="11" fill="#FFDAB9" stroke="#1a1a2e" stroke-width="2"/>
  <!-- Face paint - left cheek (flag stripe) -->
  <rect x="21" y="24" width="8" height="2" fill="#E74C3C"/>
  <rect x="21" y="26" width="8" height="2" fill="white"/>
  <rect x="21" y="28" width="8" height="2" fill="#E74C3C"/>
  <!-- Face paint - right cheek -->
  <rect x="35" y="24" width="8" height="2" fill="#3498DB"/>
  <rect x="35" y="26" width="8" height="2" fill="white"/>
  <rect x="35" y="28" width="8" height="2" fill="#3498DB"/>
  <!-- Crazy happy eyes -->
  <circle cx="28" cy="22" r="3" fill="white" stroke="#1a1a2e" stroke-width="1.5"/>
  <circle cx="36" cy="22" r="3" fill="white" stroke="#1a1a2e" stroke-width="1.5"/>
  <circle cx="29" cy="21" r="1.5" fill="#1a1a2e"/>
  <circle cx="37" cy="21" r="1.5" fill="#1a1a2e"/>
  <!-- Big open mouth screaming -->
  <ellipse cx="32" cy="30" rx="5" ry="4" fill="#1a1a2e"/>
  <path d="M28 29 Q32 34 36 29" fill="#E74C3C"/>
  <!-- Scarf -->
  <rect x="18" y="34" width="28" height="6" rx="2" fill="#E74C3C" stroke="#1a1a2e" stroke-width="1.5"/>
  <rect x="18" y="36" width="28" height="2" fill="#FFD700"/>
  <!-- Scarf tails -->
  <rect x="14" y="38" width="8" height="12" rx="2" fill="#E74C3C" stroke="#1a1a2e" stroke-width="1"/>
  <rect x="14" y="42" width="8" height="2" fill="#FFD700"/>
  <rect x="14" y="46" width="8" height="2" fill="#FFD700"/>
  <rect x="42" y="38" width="8" height="12" rx="2" fill="#E74C3C" stroke="#1a1a2e" stroke-width="1"/>
  <rect x="42" y="42" width="8" height="2" fill="#FFD700"/>
  <rect x="42" y="46" width="8" height="2" fill="#FFD700"/>
  <!-- Body -->
  <rect x="24" y="40" width="16" height="14" rx="3" fill="#E74C3C" stroke="#1a1a2e" stroke-width="1.5"/>
  <!-- Arms raised -->
  <rect x="10" y="36" width="4" height="10" rx="2" fill="#FFDAB9" stroke="#1a1a2e" stroke-width="1" transform="rotate(-20 12 41)"/>
  <rect x="50" y="36" width="4" height="10" rx="2" fill="#FFDAB9" stroke="#1a1a2e" stroke-width="1" transform="rotate(20 52 41)"/>
  <!-- Foam finger on right hand -->
  <path d="M54 32 L58 28 L62 30 L58 36 Z" fill="#FFD700" stroke="#1a1a2e" stroke-width="1.5"/>
  <text x="58" y="33" text-anchor="middle" font-family="monospace" font-size="4" font-weight="bold" fill="#1a1a2e">1</text>
</svg>