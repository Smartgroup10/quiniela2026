<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Jugador haciendo chilena (bicycle kick) -->
  <!-- Head (bottom, since upside down) -->
  <circle cx="20" cy="48" r="8" fill="#FFDAB9" stroke="#1a1a2e" stroke-width="2"/>
  <!-- Hair flying -->
  <path d="M14 52 Q12 58 10 56 Q8 60 14 56" fill="#1a1a2e"/>
  <path d="M18 54 Q16 60 20 58" fill="#1a1a2e"/>
  <!-- Determined face (upside down context) -->
  <circle cx="17" cy="47" r="1.5" fill="#1a1a2e"/>
  <circle cx="23" cy="47" r="1.5" fill="#1a1a2e"/>
  <path d="M17 44 Q20 42 23 44" stroke="#1a1a2e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Torso (angled upward) -->
  <rect x="22" y="32" width="14" height="16" rx="3" fill="#3498DB" stroke="#1a1a2e" stroke-width="2" transform="rotate(-20 29 40)"/>
  <!-- Jersey number -->
  <text x="30" y="42" text-anchor="middle" font-family="monospace" font-size="7" font-weight="bold" fill="white" transform="rotate(-20 30 42)">10</text>
  <!-- Kicking leg (extended up-right) -->
  <rect x="34" y="10" width="5" height="20" rx="2" fill="white" stroke="#1a1a2e" stroke-width="1.5" transform="rotate(30 36 20)"/>
  <!-- Kicking boot -->
  <rect x="44" y="4" width="10" height="5" rx="2" fill="#E74C3C" stroke="#1a1a2e" stroke-width="1.5" transform="rotate(30 49 6)"/>
  <!-- Other leg (bent) -->
  <rect x="28" y="20" width="5" height="14" rx="2" fill="white" stroke="#1a1a2e" stroke-width="1.5" transform="rotate(-10 30 27)"/>
  <rect x="24" y="14" width="8" height="5" rx="2" fill="#E74C3C" stroke="#1a1a2e" stroke-width="1.5" transform="rotate(-30 28 16)"/>
  <!-- Arms reaching to ground -->
  <rect x="14" y="38" width="4" height="10" rx="2" fill="#FFDAB9" stroke="#1a1a2e" stroke-width="1" transform="rotate(20 16 43)"/>
  <rect x="26" y="44" width="4" height="8" rx="2" fill="#FFDAB9" stroke="#1a1a2e" stroke-width="1" transform="rotate(-15 28 48)"/>
  <!-- Ball being kicked -->
  <circle cx="54" cy="8" r="6" fill="white" stroke="#1a1a2e" stroke-width="2"/>
  <polygon points="54,4 56,6 55,9 52,9 51,6" fill="#1a1a2e"/>
  <!-- Impact lines -->
  <line x1="56" y1="2" x2="60" y2="0" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="6" x2="64" y2="4" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
  <line x1="58" y1="12" x2="62" y2="12" stroke="#FFD700" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Ground -->
  <rect x="2" y="58" width="60" height="3" rx="1" fill="#27AE60" opacity="0.5"/>
</svg>