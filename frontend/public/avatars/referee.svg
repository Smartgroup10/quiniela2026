<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Arbitro sacando tarjeta -->
  <!-- Head -->
  <circle cx="32" cy="16" r="10" fill="#FFDAB9" stroke="#1a1a2e" stroke-width="2"/>
  <!-- Bald/short hair -->
  <path d="M22 14 Q24 6 32 8 Q40 6 42 14" fill="#4a3728"/>
  <!-- Stern eyes -->
  <circle cx="28" cy="15" r="2" fill="#1a1a2e"/>
  <circle cx="36" cy="15" r="2" fill="#1a1a2e"/>
  <!-- Eyebrows (angry) -->
  <line x1="25" y1="11" x2="30" y2="12" stroke="#1a1a2e" stroke-width="2" stroke-linecap="round"/>
  <line x1="34" y1="12" x2="39" y2="11" stroke="#1a1a2e" stroke-width="2" stroke-linecap="round"/>
  <!-- Whistle mouth -->
  <circle cx="32" cy="21" r="2" fill="#C0C0C0" stroke="#1a1a2e" stroke-width="1"/>
  <!-- Whistle string -->
  <path d="M30 21 Q28 23 26 22" stroke="#1a1a2e" stroke-width="1" fill="none"/>
  <!-- Black jersey with white stripes -->
  <rect x="22" y="26" width="20" height="18" rx="3" fill="#1a1a2e" stroke="#333" stroke-width="1"/>
  <rect x="22" y="28" width="20" height="2" fill="white"/>
  <rect x="22" y="34" width="20" height="2" fill="white"/>
  <rect x="22" y="40" width="20" height="2" fill="white"/>
  <!-- Right arm holding card UP -->
  <rect x="42" y="4" width="4" height="18" rx="2" fill="#FFDAB9" stroke="#1a1a2e" stroke-width="1.5"/>
  <!-- Yellow card -->
  <rect x="39" y="0" width="10" height="14" rx="1" fill="#FFD700" stroke="#1a1a2e" stroke-width="2"/>
  <!-- Left arm down -->
  <rect x="16" y="30" width="6" height="4" rx="2" fill="#FFDAB9" stroke="#1a1a2e" stroke-width="1"/>
  <!-- Shorts -->
  <rect x="24" y="44" width="7" height="6" rx="1" fill="#333"/>
  <rect x="33" y="44" width="7" height="6" rx="1" fill="#333"/>
  <!-- Legs -->
  <rect x="25" y="50" width="5" height="6" rx="1" fill="#FFDAB9"/>
  <rect x="34" y="50" width="5" height="6" rx="1" fill="#FFDAB9"/>
  <!-- Black boots -->
  <rect x="23" y="56" width="9" height="4" rx="2" fill="#1a1a2e"/>
  <rect x="32" y="56" width="9" height="4" rx="2" fill="#1a1a2e"/>
</svg>