<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <title>Quiniela Mundial 2026</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: #0A0D14;
        color: #F1F2EE;
      }
      :root {
        --bg-0:#0A0D14; --bg-1:#0F1320; --bg-2:#141A2A; --bg-3:#1A2236;
        --line:#232B40; --line-2:#2D3550;
        --fg-0:#F1F2EE; --fg-1:#B8BCC4; --fg-2:#7A7F8A; --fg-3:#555A66;
        --gold:#D4A93C; --gold-2:#E5BC4F;
        --gold-soft:rgba(212,169,60,0.12); --gold-line:rgba(212,169,60,0.30);
        --green:#5DBF8A; --green-soft:rgba(93,191,138,0.14); --green-line:rgba(93,191,138,0.32);
        --amber:#E8B85A; --amber-soft:rgba(232,184,90,0.12); --amber-line:rgba(232,184,90,0.30);
        --red:#E26A5E; --blue:#7BA7E8;
        --blue-soft:rgba(123,167,232,0.12); --blue-line:rgba(123,167,232,0.30);
      }
      .mono, .tnum, [data-num] {
        font-family: 'JetBrains Mono', monospace;
        font-variant-numeric: tabular-nums;
      }
      @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.45} }
      @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
