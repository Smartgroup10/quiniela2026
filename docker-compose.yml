services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=file:/app/data/quiniela.db
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY=${JWT_EXPIRY:-7d}
      - PORT=3001
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - FOOTBALL_API_KEY=${FOOTBALL_API_KEY}
      - FOOTBALL_API_ENABLED=${FOOTBALL_API_ENABLED:-false}
      - PREDICTION_LOCK_BYPASS_UNTIL=${PREDICTION_LOCK_BYPASS_UNTIL:-}
    volumes:
      - db-data:/app/data

  nginx:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  db-data:
